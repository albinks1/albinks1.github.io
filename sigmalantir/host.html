<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigmalantir - Hôte</title>
<link rel="stylesheet" href="style.css?v=26">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<img class="mini-logo" src="sigmalantir.svg" alt="Sigmalantir">
<main>
  <section id="lobby">
    <h1><img class="logo" src="sigmalantir.svg" alt="Sigmalantir"></h1>
    <p id="status" class="muted">Connexion au serveur...</p>
    <div class="join-box">
      <img id="qr" alt="QR code pour rejoindre">
      <div>
        <p class="muted">Rejoindre sur</p>
        <p id="link" class="link"></p>
        <p class="muted">Code de la partie</p>
        <p id="code" class="code">----</p>
      </div>
    </div>
    <p class="legal">En rejoignant cette partie, vous acceptez que vos données soient traitées et envoyées au gouvernement sigmalien.</p>
    <h2><span id="count">0</span> joueur(s)</h2>
    <ul id="players" class="chips"></ul>
    <button id="start" disabled>Démarrer</button>
  </section>

  <section id="question" hidden>
    <div class="bar"><span id="qnum"></span><img class="bar-logo" src="sigmalantir.svg" alt="Sigmalantir"><span class="bar-right"><span id="answered"></span><span id="timer" class="timer"></span></span></div>
    <h1 id="qtext"></h1>
    <ol id="choices" class="choices"></ol>
    <button id="skip">Arrêter le chrono</button>
  </section>

  <section id="stats" hidden>
    <h2 id="stext"></h2>
    <div id="bars"></div>
    <button id="toRank">Classement</button>
  </section>

  <section id="mail" hidden>
    <div data-s="situation inbox">
      <h2 id="mtitle"></h2>
      <p id="msit" class="situation"></p>
    </div>
    <button id="mget" data-s="situation">Suite</button>
    <div class="mailbox arrive" data-s="inbox">
      <div class="mbar"><span id="mbname"></span><span id="mbcount"></span></div>
      <button id="mrow" class="mrow"><b id="mfrom"></b><span id="mline"></span><span id="mdate"></span></button>
    </div>
    <div class="mstatus" data-s="writing closing">
      <span id="mcount"></span><span id="mtimer" class="timer"></span>
    </div>
    <p id="mconsigne" class="consigne" data-s="writing closing"></p>
    <article class="chat only-chat" data-s="open writing closing">
      <div class="chat-head"><span id="oav" class="avatar"></span><div><b id="oname"></b><small>en ligne</small></div></div>
      <div id="omsgs" class="chat-msgs"></div>
    </article>
    <article class="mailbox only-mail" data-s="open writing closing">
      <h3 id="osub" class="msub"></h3>
      <p id="ometa" class="mmeta"></p>
      <p id="obody" class="mbody"></p>
    </article>
    <button id="mgo" data-s="open">Lancer les réponses</button>
    <button id="mclose" data-s="writing">Clore les réponses</button>
    <p class="muted" data-s="closing">Réception des dernières réponses...</p>
    <p id="rnum" class="muted" data-s="replies"></p>
    <article class="chat only-chat" data-s="replies">
      <div class="chat-head"><span id="rcav" class="avatar"></span><div><b id="rcname"></b><small>en ligne</small></div></div>
      <div class="chat-msgs">
        <div id="rcin" class="bubble in"></div>
        <p id="rcwho" class="rcwho"></p>
        <div id="rcbody" class="bubble out"></div>
      </div>
    </article>
    <article class="mailbox only-mail" data-s="replies">
      <h3 id="rsub" class="msub"></h3>
      <p id="rmeta" class="mmeta"></p>
      <p id="rbody" class="mbody"></p>
    </article>
    <div class="mnav" data-s="replies">
      <button id="rprev">Réponse précédente</button>
      <label class="rnote">Note <input id="rgrade" type="number" min="0" max="10" step="0.5" inputmode="decimal" placeholder="0 à 10"> / 10</label>
      <button id="rnext">Réponse suivante</button>
    </div>
  </section>

  <section id="rank" hidden>
    <h1 id="rtitle">Classement</h1>
    <ol id="ranking" class="ranking"></ol>
    <button id="next">Question suivante</button>
    <button id="fin" hidden>Fin</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const LETTERS = 'ABCD';
// espace insécable avant ? ! : ; pour que la ponctuation ne parte pas seule à la ligne
const fr = t => String(t).replace(/ ([?!:;])/g, '\u00a0$1');
const db = firebase.initializeApp(FIREBASE_CONFIG).database();

let questions = [], qi = -1, phase = 'lobby', qStart = 0, tick = null, game, ansRef;
const players = new Map();   // identifiant du téléphone -> { name, score, on }
let answers = new Map();     // identifiant -> { i, pts } (ou { t } pour le mail)
let replies = [], ri = 0;    // réponses au mail, affichées une par une
const MAX_REPLY = 400;

const online = () => [...players.values()].filter(p => p.on).length;
const sorted = () => [...players.entries()].sort((a, b) => b[1].score - a[1].score);
const cleanName = n => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 20) || 'Joueur';

fetch('questions.json').then(r => r.json()).then(q => { questions = q; renderPlayers(); })
  .catch(() => $('status').textContent = 'Impossible de charger questions.json');

async function openRoom() {
  let code;
  do code = String(1000 + Math.floor(Math.random() * 9000));
  while ((await db.ref('games/' + code + '/state').get()).exists());
  game = db.ref('games/' + code);
  await game.child('state').set({ phase: 'lobby' });
  const url = new URL('join.html?c=' + code, location.href).href;
  $('code').textContent = code;
  $('link').textContent = url;
  $('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=' + encodeURIComponent(url);
  $('status').textContent = /^(localhost|127\.)/.test(location.hostname) || location.protocol === 'file:'
    ? 'Attention : cette adresse n\'est pas accessible depuis un téléphone (ouvrez la page via le site ou l\'IP du PC)'
    : 'Scannez le QR code pour rejoindre';
  const onPlayer = s => {
    const v = s.val() || {}, p = players.get(s.key) || { score: 0 };
    p.name = cleanName(v.name);
    p.on = !!v.on;
    players.set(s.key, p);
    renderPlayers();
    if (phase === 'question' && online() && answers.size >= online()) endQuestion();
    if (phase === 'writing' && online() && answers.size >= online()) closeReplies();
  };
  game.child('players').on('child_added', onPlayer);
  game.child('players').on('child_changed', onPlayer);
}
openRoom().catch(e => $('status').textContent = 'Erreur Firebase : ' + e.message);

function onAnswer(pid, v) {
  const p = players.get(pid), q = questions[qi];
  if (!p || phase !== 'question' || answers.has(pid)) return;
  if (!v || !Number.isInteger(v.i) || v.i < 0 || v.i >= q.c.length) return;
  const ratio = Math.min((Date.now() - qStart) / 1000 / q.time, 1);
  const pts = 'a' in q && v.i === q.a ? Math.round(1000 * (1 - ratio / 2)) : 0;
  answers.set(pid, { i: v.i, pts });
  $('answered').textContent = answers.size + ' réponse(s)';
  if (answers.size >= online()) endQuestion();
}

function renderPlayers() {
  $('count').textContent = players.size;
  $('players').replaceChildren(...[...players.values()].map(p => el('li', null, p.name)));
  $('start').disabled = !players.size || !questions.length;
}

function nextQuestion() {
  qi++;
  const q = questions[qi];
  answers = new Map();
  if (q.type === 'mail') return startMail(q);
  q.time = q.time || 20;
  phase = 'question';
  const total = questions.filter(x => x.type !== 'mail').length;   // le mail final n'est pas compté comme une question
  $('qnum').textContent = 'Question ' + (qi + 1) + ' / ' + total;
  $('qtext').textContent = fr(q.q);
  $('answered').textContent = '0 réponse(s)';
  $('choices').replaceChildren(...q.c.map((c, i) => {
    const li = el('li', 'k' + i);
    li.append(el('span', 'letter', LETTERS[i]), el('span', null, c));
    return li;
  }));
  show('question');
  game.child('state').set({ phase: 'question', n: qi, total, q: q.q, c: q.c });
  qStart = Date.now();
  ansRef = game.child('answers/' + qi);
  ansRef.on('child_added', s => onAnswer(s.key, s.val()));
  const update = () => {
    const left = Math.max(0, q.time - (Date.now() - qStart) / 1000);
    $('timer').textContent = Math.ceil(left) + ' s';
    if (left <= 0) endQuestion();
  };
  update();
  tick = setInterval(update, 200);
}

function endQuestion() {
  if (phase !== 'question') return;
  phase = 'stats';
  clearInterval(tick);
  ansRef.off();
  const q = questions[qi], poll = !('a' in q);
  const counts = q.c.map(() => 0);
  answers.forEach((r, pid) => { counts[r.i]++; players.get(pid).score += r.pts; });
  // Résultats de chaque joueur puis changement d'état, en une seule écriture
  const upd = { state: { phase: 'result', n: qi } };
  const ranks = sorted();
  ranks.forEach(([pid, p], k) => {
    const r = answers.get(pid);
    upd['results/' + pid] = { poll, answered: !!r, ok: !poll && !!r && r.i === q.a,
      pts: r ? r.pts : 0, score: p.score, rank: k + 1, total: ranks.length,
      // remarque propre à la question : par choix (sondage) ou selon bonne / mauvaise réponse
      remark: (!r ? '' : q.r ? q.r[r.i] : r.i === q.a ? q.ok : q.ko) || '' };
  });
  game.update(upd);

  $('stext').textContent = fr(q.q);
  const max = Math.max(1, ...counts);
  $('bars').replaceChildren(...q.c.map((c, i) => {
    const row = el('div', 'row' + (poll ? '' : i === q.a ? ' good' : ' dim'));
    const label = el('div', 'label');
    label.append(el('span', 'letter k' + i, LETTERS[i]), el('span', null, c));
    const track = el('div', 'track'), fill = el('div', 'fill k' + i);
    fill.style.width = '0';
    track.append(fill);
    row.append(label, track, el('div', 'n', counts[i]));
    requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = (counts[i] / max * 100) + '%'));
    return row;
  }));
  if (q.e) $('bars').append(el('p', 'explain', q.e));
  show('stats');
}

// Séquence finale : situation, mail reçu, mail ouvert, rédaction sur les téléphones, réponses au tableau
const mailStep = s => {
  $('mail').dataset.step = s;
  document.querySelectorAll('#mail [data-s]').forEach(e => e.hidden = !e.dataset.s.split(' ').includes(s));
};

function startMail(q) {
  phase = 'mail';
  $('mtitle').textContent = q.titre || 'Mise en situation';
  $('msit').textContent = fr(q.situation);
  const chat = q.canal === 'chat', heure = q.date.split(', ').pop();
  $('mail').dataset.canal = chat ? 'chat' : 'mail';
  $('mfrom').textContent = q.from;
  if (chat) {
    const msgs = q.messages.map(m => fr(m.replace('{prenom}', () => q.to)));
    $('mbname').textContent = 'Messages';
    $('mbcount').textContent = msgs.length + ' non lus';
    $('mline').textContent = msgs[0];
    $('mdate').textContent = heure;
    $('oav').textContent = $('rcav').textContent = q.from[0];
    $('oname').textContent = $('rcname').textContent = q.from;
    $('omsgs').replaceChildren(...msgs.map(m => {
      const b = el('div', 'bubble in', m);
      b.append(el('small', null, heure));
      return b;
    }));
    $('rcin').textContent = msgs[msgs.length - 1];
  } else {
    $('mbname').textContent = 'Boîte de réception';
    $('mbcount').textContent = '1 non lu';
    $('mline').textContent = fr(q.subject);
    $('mdate').textContent = q.date;
    $('osub').textContent = fr(q.subject);
    $('ometa').textContent = 'De : ' + q.from + ' | À : ' + q.to + ' | ' + q.date;
    $('obody').textContent = fr(q.body.replace('{prenom}', () => q.to));   // au tableau : le prénom du mail
  }
  $('mconsigne').textContent = fr(q.consigne);
  mailStep('situation');
  show('mail');
  game.child('state').set({ phase: 'mail', n: qi });
}

function startReplies() {
  const q = questions[qi], time = q.time || 90;
  phase = 'writing';
  $('mcount').textContent = '0 réponse(s) reçue(s)';
  mailStep('writing');
  game.child('state').set({ phase: 'reply', n: qi, canal: q.canal || 'mail', to: q.from,
    subject: q.subject ? 'Rép : ' + q.subject : '', consigne: q.consigne, date: q.date, body: q.body || '', messages: q.messages || [], time });
  ansRef = game.child('answers/' + qi);
  ansRef.on('child_added', s => onReply(s.key, s.val()));
  qStart = Date.now();
  const update = () => {
    const left = Math.max(0, Math.ceil(time - (Date.now() - qStart) / 1000));
    $('mtimer').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    if (left <= 0) closeReplies();
  };
  update();
  tick = setInterval(update, 200);
}

function onReply(pid, v) {
  const t = String(v && v.t || '').trim().slice(0, MAX_REPLY);
  if (!players.has(pid) || !t || answers.has(pid) || (phase !== 'writing' && phase !== 'closing')) return;
  answers.set(pid, { t });
  $('mcount').textContent = answers.size + ' réponse(s) reçue(s)';
  if (phase === 'writing' && answers.size >= online()) closeReplies();
}

// Les téléphones envoient alors leur brouillon : on leur laisse 3 secondes avant d'afficher les réponses
function closeReplies() {
  if (phase !== 'writing') return;
  phase = 'closing';
  clearInterval(tick);
  mailStep('closing');
  game.child('state').set({ phase: 'closing', n: qi });
  setTimeout(showReplies, 3000);
}

function showReplies() {
  ansRef.off();
  if (!answers.size) { replies = []; return finishReplies(); }
  phase = 'replies';
  replies = [...answers].map(([pid, r]) => ({ pid, name: players.get(pid).name, t: r.t, note: null }));
  ri = 0;
  mailStep('replies');
  game.child('state').set({ phase: 'replies', n: qi });
  renderReply();
}

function renderReply() {
  const q = questions[qi], r = replies[ri];
  $('rnum').textContent = 'Réponse ' + (ri + 1) + ' / ' + replies.length;
  if (q.canal === 'chat') {
    $('rcwho').textContent = 'Réponse de ' + r.name;
    $('rcbody').textContent = r.t;
  } else {
    $('rsub').textContent = fr('Rép : ' + q.subject);
    $('rmeta').textContent = 'De : ' + r.name + ' | À : ' + q.from;
    $('rbody').textContent = r.t;
  }
  $('rprev').disabled = ri === 0;
  $('rnext').textContent = ri < replies.length - 1 ? 'Réponse suivante' : qi === questions.length - 1 ? 'Classement final' : 'Classement';
  $('rgrade').value = r.note ?? '';
  $('rnext').disabled = r.note === null;   // il faut noter la réponse avant de passer à la suite
  $('rgrade').focus();
}

function gradeReply() {
  const g = $('rgrade'), valid = g.value !== '' && g.validity.valid;
  replies[ri].note = valid ? Number(g.value) : null;
  $('rnext').disabled = !valid;
}

// Les notes s'ajoutent au score du quiz, puis le classement final est envoyé aux téléphones
function finishReplies() {
  const unit = questions[qi].pointsParNote || 100;
  const upd = qi === questions.length - 1 ? {} : { state: { phase: 'interim', n: qi } };
  replies.forEach(r => {
    const p = players.get(r.pid);
    p.score += Math.round(r.note * unit);
    (p.notes = p.notes || []).push(r.note);
  });
  const ranks = sorted();
  ranks.forEach(([pid, p], k) => {
    const n = (p.notes || []).map(x => String(x).replace('.', ',') + ' / 10');
    upd['results/' + pid] = { score: p.score, rank: k + 1, total: ranks.length,
      ...(n.length ? { mail: (n.length > 1 ? 'Réponses aux mails : ' : 'Réponse au mail : ') + n.join(', ') } : {}) };
  });
  game.update(upd);
  showRank();
}

function showRank(fin) {
  phase = 'rank';
  const last = fin === true || qi === questions.length - 1;
  $('rtitle').textContent = last ? 'Classement final' : 'Classement';
  $('ranking').replaceChildren(...sorted().slice(0, 10).map(([, p]) => {
    const li = el('li');
    li.append(el('span', 'name', p.name), el('span', 'pts', p.score));
    return li;
  }));
  $('next').hidden = last;
  if (!last) $('next').textContent = questions[qi + 1].type === 'mail' ? questions[qi + 1].titre : 'Question suivante';
  $('fin').hidden = last || !questions[qi + 1].optionnel;   // « Fin » : classement définitif, la partie s'arrête ici
  if (last) game.child('state').set({ phase: 'end' });
  show('rank');
}

$('start').onclick = nextQuestion;
$('skip').onclick = endQuestion;
$('toRank').onclick = showRank;
$('next').onclick = nextQuestion;
$('mget').onclick = () => mailStep('inbox');
$('fin').onclick = () => showRank(true);
$('mrow').onclick = () => mailStep('open');
$('mgo').onclick = startReplies;
$('mclose').onclick = closeReplies;
$('rprev').onclick = () => { ri--; renderReply(); };
$('rnext').onclick = () => { if (ri < replies.length - 1) { ri++; renderReply(); } else finishReplies(); };
$('rgrade').oninput = gradeReply;
$('rgrade').onkeydown = e => { if (e.key === 'Enter' && !$('rnext').disabled) $('rnext').click(); };
</script>
<script src="anim.js?v=4"></script>
</body>
</html>
