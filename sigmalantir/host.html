<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigmalantir - Hôte</title>
<link rel="stylesheet" href="style.css?v=15">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<img class="mini-logo" src="sigmalantir.svg" alt="Sigmalantir">
<main>
  <section id="lobby">
    <h1><img class="logo" src="sigmalantir.svg" alt="Sigmalantir"></h1>
    <p id="status" class="muted">Connexion au serveur...</p>
    <div class="join-box">
      <img id="qr" alt="QR code pour rejoindre">
      <div>
        <p class="muted">Rejoindre sur</p>
        <p id="link" class="link"></p>
        <p class="muted">Code de la partie</p>
        <p id="code" class="code">----</p>
      </div>
    </div>
    <p class="legal">En rejoignant cette partie, vous acceptez que vos données soient traitées et envoyées au gouvernement américain.</p>
    <h2><span id="count">0</span> joueur(s)</h2>
    <ul id="players" class="chips"></ul>
    <button id="start" disabled>Démarrer</button>
  </section>

  <section id="question" hidden>
    <div class="bar"><span id="qnum"></span><img class="bar-logo" src="sigmalantir.svg" alt="Sigmalantir"><span class="bar-right"><span id="answered"></span><span id="timer" class="timer"></span></span></div>
    <h1 id="qtext"></h1>
    <ol id="choices" class="choices"></ol>
    <button id="skip">Arrêter le chrono</button>
  </section>

  <section id="stats" hidden>
    <h2 id="stext"></h2>
    <div id="bars"></div>
    <button id="toRank">Classement</button>
  </section>

  <section id="rank" hidden>
    <h1 id="rtitle">Classement</h1>
    <ol id="ranking" class="ranking"></ol>
    <button id="next">Question suivante</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const LETTERS = 'ABCD';
// espace insécable avant ? ! : ; pour que la ponctuation ne parte pas seule à la ligne
const fr = t => String(t).replace(/ ([?!:;])/g, '\u00a0$1');
const db = firebase.initializeApp(FIREBASE_CONFIG).database();

let questions = [], qi = -1, phase = 'lobby', qStart = 0, tick = null, game, ansRef;
const players = new Map();   // identifiant du téléphone -> { name, score, on }
let answers = new Map();     // identifiant -> { i, pts }

const online = () => [...players.values()].filter(p => p.on).length;
const sorted = () => [...players.entries()].sort((a, b) => b[1].score - a[1].score);
const cleanName = n => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 20) || 'Joueur';

fetch('questions.json').then(r => r.json()).then(q => { questions = q; renderPlayers(); })
  .catch(() => $('status').textContent = 'Impossible de charger questions.json');

async function openRoom() {
  let code;
  do code = String(1000 + Math.floor(Math.random() * 9000));
  while ((await db.ref('games/' + code + '/state').get()).exists());
  game = db.ref('games/' + code);
  await game.child('state').set({ phase: 'lobby' });
  const url = new URL('join.html?c=' + code, location.href).href;
  $('code').textContent = code;
  $('link').textContent = url;
  $('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=' + encodeURIComponent(url);
  $('status').textContent = /^(localhost|127\.)/.test(location.hostname) || location.protocol === 'file:'
    ? 'Attention : cette adresse n\'est pas accessible depuis un téléphone (ouvrez la page via le site ou l\'IP du PC)'
    : 'Scannez le QR code pour rejoindre';
  const onPlayer = s => {
    const v = s.val() || {}, p = players.get(s.key) || { score: 0 };
    p.name = cleanName(v.name);
    p.on = !!v.on;
    players.set(s.key, p);
    renderPlayers();
    if (phase === 'question' && online() && answers.size >= online()) endQuestion();
  };
  game.child('players').on('child_added', onPlayer);
  game.child('players').on('child_changed', onPlayer);
}
openRoom().catch(e => $('status').textContent = 'Erreur Firebase : ' + e.message);

function onAnswer(pid, v) {
  const p = players.get(pid), q = questions[qi];
  if (!p || phase !== 'question' || answers.has(pid)) return;
  const valid = q.type === 'note' ? v && v.n >= 0 && v.n <= 20
    : v && Number.isInteger(v.i) && v.i >= 0 && v.i < q.c.length;
  if (!valid) return;
  const ratio = Math.min((Date.now() - qStart) / 1000 / q.time, 1);
  const pts = 'a' in q && v.i === q.a ? Math.round(1000 * (1 - ratio / 2)) : 0;
  answers.set(pid, { i: v.i, pts });
  $('answered').textContent = answers.size + ' réponse(s)';
  if (answers.size >= online()) endQuestion();
}

function renderPlayers() {
  $('count').textContent = players.size;
  $('players').replaceChildren(...[...players.values()].map(p => el('li', null, p.name)));
  $('start').disabled = !players.size || !questions.length;
}

function nextQuestion() {
  qi++;
  const q = questions[qi];
  q.time = q.time || 20;
  answers = new Map();
  phase = 'question';
  $('qnum').textContent = 'Question ' + (qi + 1) + ' / ' + questions.length;
  $('qtext').textContent = fr(q.q);
  $('answered').textContent = '0 réponse(s)';
  $('choices').replaceChildren(...(q.type === 'note'
    ? [el('li', 'k1', 'Donnez une note de 0 à 20 sur votre téléphone')]
    : q.c.map((c, i) => {
      const li = el('li', 'k' + i);
      li.append(el('span', 'letter', LETTERS[i]), el('span', null, c));
      return li;
    })));
  show('question');
  game.child('state').set({ phase: 'question', n: qi, total: questions.length, q: q.q, c: q.c || [], type: q.type || 'choix' });
  qStart = Date.now();
  ansRef = game.child('answers/' + qi);
  ansRef.on('child_added', s => onAnswer(s.key, s.val()));
  const update = () => {
    const left = Math.max(0, q.time - (Date.now() - qStart) / 1000);
    $('timer').textContent = Math.ceil(left) + ' s';
    if (left <= 0) endQuestion();
  };
  update();
  tick = setInterval(update, 200);
}

function endQuestion() {
  if (phase !== 'question') return;
  phase = 'stats';
  clearInterval(tick);
  ansRef.off();
  const q = questions[qi], poll = !('a' in q), note = q.type === 'note';
  const counts = (q.c || []).map(() => 0);
  answers.forEach((r, pid) => { if (!note) counts[r.i]++; players.get(pid).score += r.pts; });
  // Résultats de chaque joueur puis changement d'état, en une seule écriture
  const upd = { state: { phase: 'result', n: qi } };
  const ranks = sorted();
  ranks.forEach(([pid, p], k) => {
    const r = answers.get(pid);
    upd['results/' + pid] = { poll, note, answered: !!r, ok: !poll && !!r && r.i === q.a,
      pts: r ? r.pts : 0, score: p.score, rank: k + 1, total: ranks.length,
      // remarque propre à la question : par choix (sondage) ou selon bonne / mauvaise réponse
      remark: (!r ? '' : q.r ? q.r[r.i] : r.i === q.a ? q.ok : q.ko) || '' };
  });
  game.update(upd);

  $('stext').textContent = fr(q.q);
  if (note) {   // quelle que soit la vraie moyenne...
    $('bars').replaceChildren(el('p', 'note-txt', 'Résultats du sondage'), el('p', 'note-big', '20/20'),
      el('p', 'note-txt muted', 'Moyenne des ' + answers.size + ' réponse(s)'));
    return show('stats');
  }
  const max = Math.max(1, ...counts);
  $('bars').replaceChildren(...q.c.map((c, i) => {
    const row = el('div', 'row' + (poll ? '' : i === q.a ? ' good' : ' dim'));
    const label = el('div', 'label');
    label.append(el('span', 'letter k' + i, LETTERS[i]), el('span', null, c));
    const track = el('div', 'track'), fill = el('div', 'fill k' + i);
    fill.style.width = '0';
    track.append(fill);
    row.append(label, track, el('div', 'n', counts[i]));
    requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = (counts[i] / max * 100) + '%'));
    return row;
  }));
  if (q.e) $('bars').append(el('p', 'explain', q.e));
  show('stats');
}

function showRank() {
  phase = 'rank';
  const last = qi === questions.length - 1;
  $('rtitle').textContent = last ? 'Classement final' : 'Classement';
  $('ranking').replaceChildren(...sorted().slice(0, 10).map(([, p]) => {
    const li = el('li');
    li.append(el('span', 'name', p.name), el('span', 'pts', p.score));
    return li;
  }));
  $('next').hidden = last;
  if (last) game.child('state').set({ phase: 'end' });
  show('rank');
}

$('start').onclick = nextQuestion;
$('skip').onclick = endQuestion;
$('toRank').onclick = showRank;
$('next').onclick = nextQuestion;
</script>
<script src="anim.js?v=4"></script>
</body>
</html>
