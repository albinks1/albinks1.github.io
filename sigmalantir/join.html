<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigmalantir</title>
<link rel="stylesheet" href="style.css?v=23">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<img class="mini-logo" src="sigmalantir.svg" alt="Sigmalantir">
<main>
  <section id="login">
    <h1><img class="logo" src="sigmalantir.svg" alt="Sigmalantir"></h1>
    <form id="form">
      <input id="code" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="Code" required>
      <input id="name" maxlength="20" placeholder="Pseudo" autocomplete="off" required>
      <label class="consent"><input type="checkbox" required> J'accepte que mes données soient traitées et envoyées au gouvernement sigmalien.</label>
      <button>Rejoindre</button>
    </form>
    <p id="msg" class="muted"></p>
  </section>

  <section id="lobby" hidden>
    <img class="logo" src="sigmalantir.svg" alt="Sigmalantir">
    <div class="spin-wrap"><div id="spin" class="spin"></div></div>
    <h2 id="ltitle"></h2>
    <p id="lname" class="muted"></p>
  </section>

  <section id="wait" hidden>
    <h2 id="wtitle"></h2>
    <p id="wremark" class="remark"></p>
    <p id="wtext"></p>
    <p id="wscore" class="score"></p>
  </section>

  <section id="play" hidden>
    <div class="head"><img class="head-logo" src="sigmalantir.svg" alt="Sigmalantir"><span id="pnum" class="muted"></span></div>
    <h2 id="ptext"></h2>
    <div id="btns" class="answers"></div>
  </section>

  <section id="reply" hidden>
    <p id="rconsigne" class="muted"></p>
    <form id="rform" class="compose">
      <div class="chead"><b>Répondre</b><span id="rtimer" class="timer"></span></div>
      <div class="cline"><span>À</span><b id="rto"></b></div>
      <div class="cline"><span>Objet</span><b id="rsub"></b></div>
      <textarea id="rtext" maxlength="400" placeholder="Rédigez votre réponse" required></textarea>
      <div class="cfoot"><span id="rcount"></span><button>Envoyer</button></div>
      <blockquote class="cquote"><p id="rqhead"></p><p id="rqbody"></p></blockquote>
    </form>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
const LETTERS = 'ABCD';
// espace insécable avant ? ! : ; pour que la ponctuation ne parte pas seule à la ligne
const fr = t => String(t).replace(/ ([?!:;])/g, '\u00a0$1');
const db = firebase.initializeApp(FIREBASE_CONFIG).database();
let game, pid, myName = '', answered = -1, current, rTick;
const pick = a => a[Math.floor(Math.random() * a.length)];
const MSG = {
  ok: ['Bonne réponse.'],
  ko: ['Mauvaise réponse.'],
  none: ['Aucune réponse enregistrée.']
};

function answer(data) {
  answered = current;
  game.child('answers/' + current + '/' + pid).set(data);
  wait('Réponse envoyée', 'En attente des autres joueurs...');
}

// Réponse au mail final : envoyée au clic, ou automatiquement à la fin du temps
function sendReply() {
  const t = $('rtext').value.trim();
  if (!t || answered === current) return false;
  answered = current;
  clearInterval(rTick);
  game.child('answers/' + current + '/' + pid).set({ t });
  return true;
}
// Écran avec la roue 3D : attente des joueurs et moments où il faut regarder le tableau
function board(title, text) {
  $('ltitle').textContent = title;
  $('lname').textContent = text;
  show('lobby');
}
const replySent = () => board('Réponse envoyée', 'Regardez le tableau.');
$('rform').onsubmit = e => { e.preventDefault(); if (sendReply()) replySent(); };
$('rtext').oninput = () => $('rcount').textContent = $('rtext').value.length + ' / 400';

function openReply(st) {
  current = st.n;
  $('rto').textContent = st.to;
  $('rsub').textContent = fr(st.subject);
  $('rconsigne').textContent = fr(st.consigne);
  $('rqhead').textContent = st.date + ', ' + st.to + ' a écrit :';
  $('rqbody').textContent = fr(st.body.replace('{prenom}', () => myName));   // le mail s'adresse au joueur par son pseudo
  $('rtext').value = '';
  $('rcount').textContent = '0 / 400';
  const end = Date.now() + st.time * 1000;
  const update = () => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    $('rtimer').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  };
  update();
  clearInterval(rTick);
  rTick = setInterval(update, 250);
  show('reply');
}

const code = new URLSearchParams(location.search).get('c');
if (code) { $('code').value = code; $('name').focus(); }

function wait(title, text, score, cls, remark) {
  $('wremark').textContent = remark || '';
  $('wtitle').textContent = title;
  $('wtext').textContent = text || '';
  $('wscore').textContent = score != null ? score + ' pts' : '';
  $('wait').className = cls || '';
  show('wait');
}

function fail(msg) {
  $('msg').textContent = msg;
  show('login');
}

// Identifiant du téléphone, conservé pour garder son score après un rechargement
function phoneId(c) {
  const key = 'sigmalantir-' + c, id = Math.random().toString(36).slice(2, 10);
  try {
    if (!localStorage.getItem(key)) localStorage.setItem(key, id);
    return localStorage.getItem(key) || id;
  } catch { return id; }
}

$('form').onsubmit = async e => {
  e.preventDefault();
  const c = $('code').value.trim();
  myName = $('name').value.replace(/\s+/g, ' ').trim().slice(0, 20);
  $('msg').textContent = 'Connexion...';
  if (game) { game.child('state').off(); db.ref('.info/connected').off(); }
  try {
    game = db.ref('games/' + c);
    if (!(await game.child('state').get()).exists()) return fail('Partie introuvable, vérifiez le code.');
    pid = phoneId(c);
    const me = game.child('players/' + pid);
    await me.update({ name: myName, on: true });
    // présence : "on" repasse à false si le téléphone se déconnecte, et à true quand il revient
    db.ref('.info/connected').on('value', s => {
      if (!s.val()) return;
      me.child('on').onDisconnect().set(false);
      me.child('on').set(true);
    });
    game.child('state').on('value', s => onState(s.val()));
  } catch (err) {
    fail('Erreur : ' + err.message);
  }
};

// Roue de l'écran d'attente : l'animation en cours, recopiée sur 10 couches
// décalées en profondeur pour lui donner de l'épaisseur
const LAYERS = [...Array(10)].map((_, k) => {
  const c = document.createElement('canvas');
  c.width = 150; c.height = 240;
  c.style.transform = 'translateZ(' + (k - 4.5) * 1.6 + 'px)';
  c.couleur = k === 0 || k === 9 ? '#ffffff' : '#5a5a72';   // faces blanches, tranche plus sombre
  $('spin').append(c);
  return c;
});
setInterval(() => {
  const src = window.SIGMA_CANVAS;
  if (!src || $('lobby').hidden) return;
  LAYERS.forEach(c => {
    const x = c.getContext('2d');
    x.globalCompositeOperation = 'source-over';
    x.clearRect(0, 0, c.width, c.height);
    x.drawImage(src, 0, 0);
    x.globalCompositeOperation = 'source-in';   // recolore le trait noir, sans filtre CSS
    x.fillStyle = c.couleur;
    x.fillRect(0, 0, c.width, c.height);
  });
}, 40);

function onState(st) {
  if (!st) return fail('La partie a été fermée.');
  if (st.phase === 'lobby') board('En attente d\'autres adversaires', 'Connecté en tant que ' + myName);
  else if (st.phase === 'question') {
    if (answered === st.n) return wait('Réponse envoyée', 'En attente des autres joueurs...');
    $('pnum').textContent = 'Question ' + (st.n + 1) + ' / ' + st.total;
    $('ptext').textContent = fr(st.q);
    current = st.n;
    $('btns').replaceChildren(...st.c.map((c, i) => {
      const b = document.createElement('button');
      b.className = 'k' + i;
      const l = document.createElement('span');
      l.className = 'letter';
      l.textContent = LETTERS[i];
      b.append(l, document.createTextNode(c));
      b.onclick = () => answer({ i });
      return b;
    }));
    show('play');
  }
  else if (st.phase === 'mail') board('Regardez le tableau', 'Un nouveau mail vient d\'arriver.');
  else if (st.phase === 'reply') {
    if (answered === st.n) replySent();
    else if ($('reply').hidden) openReply(st);
  }
  else if (st.phase === 'closing') {
    clearInterval(rTick);
    if (answered === st.n || (current === st.n && sendReply())) replySent();
    else board('Temps écoulé', 'Regardez le tableau.');
  }
  else if (st.phase === 'interim') game.child('results/' + pid).get().then(s => {
    const d = s.val();
    if (d) wait('Classement provisoire', 'Rang ' + d.rank + ' / ' + d.total, d.score, '', d.mail || '');
  });
  else if (st.phase === 'replies') board('Regardez le tableau', 'Les réponses sont en cours de lecture.');
  else {
    game.child('results/' + pid).get().then(s => showResult(s.val(), st.phase === 'end'));
  }
}

function showResult(d, end) {
  if (!d) return wait(end ? 'Partie terminée' : myName, end ? '' : 'Vous jouerez à la prochaine question.');
  const rank = 'Rang ' + d.rank + ' / ' + d.total;
  if (end) wait('Partie terminée', 'Classement final : ' + d.rank + ' / ' + d.total, d.score, '', d.mail || '');
  else if (!d.answered) wait(pick(MSG.none), rank, d.score, 'ko');
  else if (d.poll) wait('Merci pour votre vote', rank, d.score, '', d.remark);
  else if (d.ok) wait(pick(MSG.ok), '+' + d.pts + ' pts - ' + rank, d.score, 'ok', d.remark);
  else wait(pick(MSG.ko), rank, d.score, 'ko', d.remark);
}
</script>
<script src="anim.js?v=4"></script>
</body>
</html>
