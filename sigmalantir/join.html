<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigmalantir</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<main>
  <section id="login">
    <h1><img class="logo" src="sigmalantir.svg" alt="Sigmalantir"></h1>
    <form id="form">
      <input id="code" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="Code" required>
      <input id="name" maxlength="20" placeholder="Pseudo" autocomplete="off" required>
      <button>Rejoindre</button>
    </form>
    <p id="msg" class="muted"></p>
  </section>

  <section id="wait" hidden>
    <h2 id="wtitle"></h2>
    <p id="wtext"></p>
    <p id="wscore" class="score"></p>
  </section>

  <section id="play" hidden>
    <p id="pnum" class="muted"></p>
    <h2 id="ptext"></h2>
    <div id="btns" class="answers"></div>
    <form id="noteform" hidden>
      <input id="note" type="number" min="0" max="20" step="0.5" inputmode="decimal" placeholder="Note sur 20" required>
      <button>Valider</button>
    </form>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
const LETTERS = 'ABCD';
const db = firebase.initializeApp(FIREBASE_CONFIG).database();
let game, pid, myName = '', answered = -1, current;
const pick = a => a[Math.floor(Math.random() * a.length)];
const MSG = {
  ok: ['Bonne réponse ! Tu pèses un max !', 'Correct ! Le cerveau est allumé.', 'Bien joué, tu es une légende.',
    'Exact ! Les autres peuvent rentrer chez eux.', 'Bonne réponse ! Rien ne t\'arrête.'],
  ko: ['Mauvaise réponse, c\'est lamentable...', 'Raté. On en reparlera.', 'Faux. Même la roue aurait trouvé.',
    'Mauvaise réponse... Tu fais exprès ?', 'Non. Juste non.'],
  none: ['Pas de réponse ? Tu dormais ?', 'Trop lent. Beaucoup trop lent.', 'Le chrono t\'a battu.']
};

function answer(data) {
  answered = current;
  game.child('answers/' + current + '/' + pid).set(data);
  wait('Réponse envoyée', 'En attente des autres joueurs...');
}
$('noteform').onsubmit = e => { e.preventDefault(); answer({ n: Number($('note').value) }); };

const code = new URLSearchParams(location.search).get('c');
if (code) { $('code').value = code; $('name').focus(); }

function wait(title, text, score, cls) {
  $('wtitle').textContent = title;
  $('wtext').textContent = text || '';
  $('wscore').textContent = score != null ? score + ' pts' : '';
  $('wait').className = cls || '';
  show('wait');
}

function fail(msg) {
  $('msg').textContent = msg;
  show('login');
}

// Identifiant du téléphone, conservé pour garder son score après un rechargement
function phoneId(c) {
  const key = 'sigmalantir-' + c, id = Math.random().toString(36).slice(2, 10);
  try {
    if (!localStorage.getItem(key)) localStorage.setItem(key, id);
    return localStorage.getItem(key) || id;
  } catch { return id; }
}

$('form').onsubmit = async e => {
  e.preventDefault();
  const c = $('code').value.trim();
  myName = $('name').value.replace(/\s+/g, ' ').trim().slice(0, 20);
  $('msg').textContent = 'Connexion...';
  if (game) { game.child('state').off(); db.ref('.info/connected').off(); }
  try {
    game = db.ref('games/' + c);
    if (!(await game.child('state').get()).exists()) return fail('Partie introuvable, vérifiez le code.');
    pid = phoneId(c);
    const me = game.child('players/' + pid);
    await me.update({ name: myName, on: true });
    // présence : "on" repasse à false si le téléphone se déconnecte, et à true quand il revient
    db.ref('.info/connected').on('value', s => {
      if (!s.val()) return;
      me.child('on').onDisconnect().set(false);
      me.child('on').set(true);
    });
    game.child('state').on('value', s => onState(s.val()));
  } catch (err) {
    fail('Erreur : ' + err.message);
  }
};

function onState(st) {
  if (!st) return fail('La partie a été fermée.');
  if (st.phase === 'lobby') wait(myName, 'Vous êtes inscrit. Regardez l\'écran.');
  else if (st.phase === 'question') {
    if (answered === st.n) return wait('Réponse envoyée', 'En attente des autres joueurs...');
    $('pnum').textContent = 'Question ' + (st.n + 1) + ' / ' + st.total;
    $('ptext').textContent = st.q;
    current = st.n;
    const note = st.type === 'note';
    $('noteform').hidden = !note;
    $('note').value = '';
    $('btns').replaceChildren(...(note ? [] : st.c).map((c, i) => {
      const b = document.createElement('button');
      b.className = 'k' + i;
      const l = document.createElement('span');
      l.className = 'letter';
      l.textContent = LETTERS[i];
      b.append(l, document.createTextNode(c));
      b.onclick = () => answer({ i });
      return b;
    }));
    show('play');
  } else {
    game.child('results/' + pid).get().then(s => showResult(s.val(), st.phase === 'end'));
  }
}

function showResult(d, end) {
  if (!d) return wait(myName, 'Vous jouerez à la prochaine question.');
  const rank = 'Rang ' + d.rank + ' / ' + d.total;
  if (end) wait('Partie terminée', 'Classement final : ' + d.rank + ' / ' + d.total, d.score);
  else if (d.note) wait('Merci pour votre 20/20 !', 'Nous aussi on vous aime.', d.score);
  else if (!d.answered) wait(pick(MSG.none), rank, d.score, 'ko');
  else if (d.poll) wait('Merci pour votre vote', rank, d.score);
  else if (d.ok) wait(pick(MSG.ok), '+' + d.pts + ' pts - ' + rank, d.score, 'ok');
  else wait(pick(MSG.ko), rank, d.score, 'ko');
}
</script>
<script src="anim.js"></script>
</body>
</html>
